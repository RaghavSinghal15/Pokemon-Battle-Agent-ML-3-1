name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest

  live:
    name: Games on a local Showdown server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[dev]"
      - name: Start Showdown
        run: |
          git clone --depth 1 https://github.com/smogon/pokemon-showdown.git ../pokemon-showdown
          cd ../pokemon-showdown
          npm install
          cp config/config-example.js config/config.js
          nohup node pokemon-showdown start --no-security > showdown.log 2>&1 &
          for i in $(seq 1 60); do nc -z localhost 8000 && break; sleep 2; done
      - run: python scripts/check_setup.py
      - run: python scripts/play_baselines.py --games 20
      - run: pytest -m showdown
